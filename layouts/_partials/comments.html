{{- if not .Params.disableShare -}}
{{- $api := strings.TrimSuffix "/" (default "" .Site.Params.garrulApi) -}}
{{- if $api -}}
<section class="comments">
    <hr>
    <h3>{{ if eq .Language.Lang "id" }}Komentar{{ else }}Comments{{ end }}</h3>
    <div
        id="garrul"
        data-slug="{{ strings.Trim .RelPermalink "/" }}"
        data-api="{{ $api }}"
        data-title="{{ .Title }}"
        data-url="{{ .Permalink }}"
        data-published="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}"
    ></div>
</section>
<script>
    (function () {
        var mount = document.getElementById("garrul");
        if (!mount) return;

        function load() {
            if (mount.dataset.loaded) return;
            mount.dataset.loaded = "true";
            var script = document.createElement("script");
            script.src = mount.dataset.api + "/embed.js";
            script.defer = true;
            document.body.appendChild(script);
        }

        if ("IntersectionObserver" in window) {
            var observer = new IntersectionObserver(function (entries) {
                if (entries.some(function (entry) { return entry.isIntersecting; })) {
                    observer.disconnect();
                    load();
                }
            }, { rootMargin: "500px 0px" });
            observer.observe(mount);
        } else {
            load();
        }
    })();
</script>
{{- end -}}
{{- end -}}
